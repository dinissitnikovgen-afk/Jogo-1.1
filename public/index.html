<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Brawl Web - Multiplayer Central</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0a0a12; }
  body { display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; box-shadow: 0 0 60px rgba(80,120,255,0.25); border-radius: 6px; image-rendering: auto; }
  
  #modalOverlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 100;
    background: rgba(8,20,50,0.55); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    opacity: 0; transition: opacity .18s ease;
  }
  #modalOverlay.open { opacity: 1; }
  #modalBox {
    position: relative; width: min(92vw, 460px); padding: 56px 28px 22px; text-align: center;
    background: linear-gradient(180deg, #2a6be0 0%, #17418f 100%);
    border: 4px solid #fff; border-radius: 24px;
    box-shadow: 0 18px 50px rgba(0,10,60,0.6), inset 0 2px 0 rgba(255,255,255,0.35);
    transform: translateY(16px) scale(.95); transition: transform .24s cubic-bezier(.2,1.3,.4,1);
    font-family: 'Lilita One', 'Arial Black', system-ui, sans-serif;
  }
  #modalOverlay.open #modalBox { transform: none; }
  #modalBox.shake { animation: modalShake .38s; }
  @keyframes modalShake { 0%,100% { transform: none; } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
  .modal-icon {
    position: absolute; top: -38px; left: 50%; margin-left: -38px; width: 76px; height: 76px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 36px;
    background: linear-gradient(180deg, #ffc15e, #f08a24); border: 4px solid #fff; box-shadow: 0 6px 0 #b8631a, 0 10px 20px rgba(0,0,0,0.3);
  }
  #modalTitle { color: #fff; font-size: 36px; font-weight: normal; letter-spacing: .5px; text-shadow: 0 3px 0 rgba(0,20,80,0.55); }
  .modal-sub { margin-top: 6px; color: #d7e6ff; font: 15px/1.4 system-ui, sans-serif; }
  .modal-sub b { color: #ffd37a; }
  #modalCells { position: relative; display: flex; justify-content: center; gap: 10px; margin: 22px 0 8px; cursor: text; }
  #modalCells .cell {
    position: relative; flex: 1; max-width: 54px; height: 68px; line-height: 64px; font-size: 42px; color: #102a43;
    background: linear-gradient(180deg, #fff, #dbe8ff); border: 3px solid #7fa6e8; border-radius: 12px; box-shadow: 0 4px 0 #8fb0ea;
    transition: border-color .12s, box-shadow .12s, transform .12s;
  }
  #modalCells .cell.filled { border-color: #fff; animation: cellPop .16s ease-out; }
  #modalCells .cell.active { border-color: #ffb347; box-shadow: 0 4px 0 #8fb0ea, 0 0 0 4px rgba(255,179,71,0.35); transform: translateY(-2px); }
  #modalCells .cell.active:not(.filled)::after { content: ''; position: absolute; left: 50%; top: 16px; width: 3px; height: 34px; margin-left: -1.5px; background: #2f6fd8; border-radius: 2px; animation: caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  @keyframes cellPop { 0% { transform: scale(.85); } 100% { transform: scale(1); } }
  #modalInput { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; border: 0; outline: 0; background: transparent; cursor: text; }
  #modalError { min-height: 22px; margin-top: 4px; color: #ffd2cc; font: bold 14px system-ui, sans-serif; }
  .modal-actions { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .btn-go {
    padding: 12px 20px; font: 24px 'Lilita One', 'Arial Black', system-ui, sans-serif; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #4cdf8b, #1fa85a); border: 3px solid #fff; border-radius: 16px;
    box-shadow: 0 5px 0 #14773e; text-shadow: 0 2px 0 rgba(0,60,20,0.5); transition: filter .12s, transform .06s;
  }
  .btn-go:hover:not(:disabled) { filter: brightness(1.08); }
  .btn-go:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #14773e; }
  .btn-go:disabled { filter: grayscale(.75) opacity(.55); cursor: not-allowed; }
  .btn-cancel { padding: 8px; font: 18px 'Lilita One', 'Arial Black', system-ui, sans-serif; color: #cfe0ff; background: none; border: 0; cursor: pointer; }
  .btn-cancel:hover { color: #fff; text-decoration: underline; }
  #modalClose {
    position: absolute; top: -16px; right: -16px; width: 38px; height: 38px; border-radius: 50%; cursor: pointer;
    background: linear-gradient(180deg, #4aa8ff, #1565d8); color: #fff; font: bold 18px system-ui, sans-serif; line-height: 1;
    border: 3px solid #fff; box-shadow: 0 3px 0 #0b3d91; display: flex; align-items: center; justify-content: center;
  }
  #modalClose:hover { filter: brightness(1.15); }
  .modal-tip { margin-top: 12px; color: #9fbcf0; font: 12.5px system-ui, sans-serif; }

  /* ---- Janela Cadastrar / Entrar ---- */
  #authOverlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 110;
    background: rgba(8,20,50,0.55); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    opacity: 0; transition: opacity .18s ease;
  }
  #authOverlay.open { opacity: 1; }
  #authBox {
    position: relative; width: min(92vw, 440px); padding: 26px 28px 18px; text-align: center;
    background: linear-gradient(180deg, #2a6be0 0%, #17418f 100%); border: 4px solid #fff; border-radius: 24px;
    box-shadow: 0 18px 50px rgba(0,10,60,0.6), inset 0 2px 0 rgba(255,255,255,0.35);
    transform: translateY(16px) scale(.95); transition: transform .24s cubic-bezier(.2,1.3,.4,1);
    font-family: 'Lilita One', 'Arial Black', system-ui, sans-serif;
  }
  #authOverlay.open #authBox { transform: none; }
  #authBox.shake { animation: modalShake .38s; }
  .auth-title { color: #fff; font-size: 34px; font-weight: normal; text-shadow: 0 3px 0 rgba(0,20,80,0.55); }
  #authSub { min-height: 0; }
  .auth-tabs { display: flex; gap: 8px; margin: 14px 0 14px; }
  .auth-tab {
    flex: 1; padding: 9px; font: 20px 'Lilita One', 'Arial Black', system-ui, sans-serif; color: #cfe0ff; cursor: pointer;
    background: rgba(255,255,255,0.12); border: 3px solid transparent; border-radius: 14px;
  }
  .auth-tab.on { color: #fff; background: linear-gradient(180deg, #ffc15e, #f08a24); border-color: #fff; text-shadow: 0 2px 0 rgba(120,50,0,0.45); }
  .auth-field {
    display: block; width: 100%; margin: 0 0 10px; padding: 12px 14px; font: 17px system-ui, sans-serif; color: #102a43;
    background: #fff; border: 3px solid #7fa6e8; border-radius: 12px; outline: 0;
  }
  .auth-field:focus { border-color: #ffb347; box-shadow: 0 0 0 4px rgba(255,179,71,0.35); }
  #authError { min-height: 22px; margin: 2px 0 6px; color: #ffd2cc; font: bold 14px system-ui, sans-serif; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
</head>
<body>

<div id="modalOverlay">
  <div id="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button type="button" id="modalClose" onclick="closeModal()" aria-label="Fechar">✕</button>
    <div class="modal-icon">🔑</div>
    <h2 id="modalTitle">Entrar na sala</h2>
    <p class="modal-sub">Pede ao teu amigo o <b>código de 6 números</b> da sala dele.</p>
    <div id="modalCells" onclick="document.getElementById('modalInput').focus()">
      <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
      <input type="text" id="modalInput" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="Código da sala (6 números)">
    </div>
    <div id="modalError" aria-live="polite"></div>
    <div class="modal-actions">
      <button type="button" id="modalGo" class="btn-go" onclick="submitModalCode()" disabled>Entrar na sala</button>
      <button type="button" class="btn-cancel" onclick="closeModal()">Cancelar</button>
    </div>
    <div class="modal-tip">💡 Podes colar o código · Enter para entrar · Esc para fechar</div>
  </div>
</div>

<div id="authOverlay">
  <div id="authBox" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <h2 class="auth-title" id="authTitle">Entrar na conta</h2>
    <p class="modal-sub" id="authSub" style="display:none"></p>
    <div class="auth-tabs">
      <button type="button" class="auth-tab on" id="authTabLogin">Entrar</button>
      <button type="button" class="auth-tab" id="authTabReg">Cadastrar</button>
    </div>
    <input class="auth-field" id="authName" type="text" maxlength="16" autocomplete="username" spellcheck="false" placeholder="Nome de jogador" aria-label="Nome de jogador">
    <input class="auth-field" id="authPass" type="password" maxlength="64" autocomplete="current-password" placeholder="Senha" aria-label="Senha">
    <input class="auth-field" id="authPass2" type="password" maxlength="64" autocomplete="new-password" placeholder="Repetir senha" aria-label="Repetir senha" style="display:none">
    <div id="authError" aria-live="polite"></div>
    <div class="modal-actions">
      <button type="button" id="authGo" class="btn-go">Entrar</button>
      <button type="button" id="authCancel" class="btn-cancel">Cancelar</button>
    </div>
    <div class="modal-tip">Nome: 3 a 16 caracteres · Senha: mínimo 4 · Enter para confirmar</div>
  </div>
</div>

<canvas id="game" width="1280" height="720"></canvas>

<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
ctx.imageSmoothingEnabled = false;

const GRAVITY = 0.7, MAX_FALL = 18, GROUND_FRICTION = 0.82, AIR_FRICTION = 0.96;
// Mundo maior que a tela (zoom-out leve) + zonas de morte nas bordas
const WW = 1440, WH = 810, Z = W / WW;
const BLAST = { l: -160, r: WW + 160, t: -280, b: WH + 140 };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// ============================================================
// DADOS (PERSONAGENS E MAPAS)
// ============================================================
const CHARACTERS = {
  ignis: { id:'ignis', name:'IGNIS', title:'Forjador', color:'#ff4400', accent:'#ffaa00', skin:'#e0885c', eye:'#ffcc00', stats:{ speed:0.75, weight:1.5, jump:14, damageMult:1.3, size:1.15 }, attacks:{ light:{ startup:6, active:6, recovery:12, damage:7, knockback:6, reach:76, height:55, offsetY:-5 }, heavy:{ startup:16, active:7, recovery:22, damage:15, knockback:13, reach:95, height:85, offsetY:10, wave:true, launch:1.3 }, special:{ startup:14, active:4, recovery:24, damage:12, knockback:11, reach:0, height:0, offsetY:-10, projectile:true, proj:'fire' } } },
  aria: { id:'aria', name:'ARIA', title:'Dançarina', color:'#00ddff', accent:'#ffffff', skin:'#ffddcc', eye:'#0055aa', stats:{ speed:1.35, weight:0.7, jump:17, damageMult:1.1, size:0.9 }, attacks:{ light:{ startup:4, active:5, recovery:9, damage:7, knockback:5, reach:80, height:52, offsetY:-8, lunge:9 }, heavy:{ startup:11, active:6, recovery:19, damage:13, knockback:10, reach:72, height:135, offsetY:-72, launch:2.2, hop:8 }, special:{ startup:12, active:4, recovery:22, damage:5, knockback:6, reach:0, height:0, offsetY:-10, projectile:true, proj:'ice' } } },
  volt: { id:'volt', name:'VOLT', title:'Trapaceiro', color:'#2a4b8d', accent:'#ffdd00', skin:'#ffccaa', eye:'#00ddff', stats:{ speed:1.0, weight:1.0, jump:15, damageMult:1.0, size:1.0 }, attacks:{ light:{ startup:5, active:4, recovery:9, damage:6, knockback:5, reach:70, height:50, offsetY:-5 }, heavy:{ startup:11, active:8, recovery:18, damage:12, knockback:10, reach:90, height:90, offsetY:-15, launch:1.6 }, special:{ startup:14, active:4, recovery:20, damage:9, knockback:8, reach:0, height:0, offsetY:-10, projectile:true, proj:'bolt' } } }
};

const MAPS = {
  forja: { id:'forja', name:'FORJA VULCÂNICA', desc:'A lava queima e te arremessa.', bg:['#0d0200','#2e0800','#8a1500'], accentColor:'#ff3300', lavaY:745, lowY:650,
    platforms:[
      { x:500, y:560, w:440, h:26, main:true },
      { x:130, y:440, w:240, h:18 }, { x:1070, y:440, w:240, h:18 },
      { x:420, y:360, w:150, h:16 }, { x:870, y:360, w:150, h:16 },
      { x:620, y:230, w:200, h:16, moving:true, range:300, speed:0.015 }
    ],
    spawns:[{x:640,y:470},{x:800,y:470}],
    hazards:[{ type:'lavaJet', x:250, top:470, cycle:240, warn:60, active:45, offset:0 },{ type:'lavaJet', x:1190, top:470, cycle:240, warn:60, active:45, offset:120 }] },
  templo: { id:'templo', name:'TEMPLO CELESTE', desc:'Plataformas somem. Vento forte.', bg:['#050818','#12214a','#3d5a96'], accentColor:'#88ccff', lowY:640,
    platforms:[
      { x:570, y:470, w:300, h:22, main:true },
      { x:150, y:580, w:200, h:16 }, { x:1090, y:580, w:200, h:16 },
      { x:300, y:430, w:170, h:14 }, { x:970, y:430, w:170, h:14 },
      { x:90, y:310, w:150, h:14 }, { x:1200, y:310, w:150, h:14 },
      { x:470, y:320, w:140, h:14 }, { x:830, y:320, w:140, h:14 },
      { x:650, y:190, w:140, h:14, phasing:true, onTime:180, offTime:120, offset:0 },
      { x:560, y:690, w:320, h:14, phasing:true, onTime:200, offTime:100, offset:100 }
    ],
    spawns:[{x:640,y:400},{x:800,y:400}],
    hazards:[{ type:'wind', y:500, h:110, dir:1, cycle:300, warn:60, active:120, offset:0 }] },
  planicie: { id:'planicie', name:'PLANÍCIE VERDE', desc:'Natureza exuberante.', bg:['#2f9fe8','#8fd8ff','#d6f3ff'], accentColor:'#38b000', lowY:760,
    platforms:[
      { x:0, y:700, w:1440, h:110, main:true },          // chão
      { x:90, y:500, w:270, h:30, tree:true },           // ilha esquerda (com árvore)
      { x:430, y:590, w:300, h:30 },                     // ilha do meio
      { x:520, y:460, w:180, h:15, bridge:true },        // ponte de madeira
      { x:560, y:330, w:240, h:30 },                     // plataforma do céu (liga ao lado esquerdo)
      { x:880, y:400, w:140, h:300, solid:true },        // pilar
      { x:860, y:300, w:500, h:30 },                     // plataforma direita grande
      { x:1010, y:150, w:230, h:30 },                    // plataforma alta
      { x:1130, y:590, w:210, h:30 },                    // NOVO: degrau direito 1
      { x:1250, y:450, w:150, h:30 }                     // NOVO: degrau direito 2
    ],
    spawns:[{x:330,y:640},{x:790,y:640}], hazards:[] }
};

// ============================================================
// ESTADO GLOBAL E REDE
// ============================================================
const S = {
  screen:'menu', menuSub: 'main', mode:null, p1Char:null, p2Char:null, map:null,
  players:[], projectiles:[], particles:[],
  hitlag:0, shake:0, frame:0, winner:null, menuHover:null,
  votes: {}, myVote: null, _startingGame: false
};

let socket = null, isHost = false, isMultiplayer = false, myRoomCode = "", mySeat = 0;

const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

const mouse = { x:0, y:0, click:false };
canvas.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * (W / r.width); mouse.y = (e.clientY - r.top) * (H / r.height); });
canvas.addEventListener('click', () => { mouse.click = true; });

// ============================================================
// LIGAÇÃO MULTIPLAYER — SERVIDOR CENTRAL (WEBSOCKET)
// ============================================================
let netStatus = '', netError = '', netConnected = false;
const EMPTY_INPUT = { left:false, right:false, jump:false, down:false, dodge:false, light:false, heavy:false, special:false };
function sendNet(payload) {
  if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(payload));
}
// ---- Janela "Entrar na sala" ----
const modalEl = id => document.getElementById(id);
function modalRender() {
  const input = modalEl('modalInput'), v = input.value || '';
  const cells = document.querySelectorAll('#modalCells .cell');
  cells.forEach((c, i) => {
    c.textContent = v[i] || '';
    c.classList.toggle('filled', i < v.length);
    c.classList.toggle('active', i === Math.min(v.length, 5) && document.activeElement === input);
  });
  modalEl('modalGo').disabled = v.length !== 6;
}
function modalSetError(msg) { modalEl('modalError').textContent = msg || ''; }
function openModal() {
  const ov = modalEl('modalOverlay'), input = modalEl('modalInput');
  ov.style.display = 'flex'; void ov.offsetWidth; ov.classList.add('open');
  input.value = ''; modalSetError(''); modalRender(); input.focus();
}
function closeModal() {
  const ov = modalEl('modalOverlay');
  ov.classList.remove('open'); ov.style.display = 'none'; modalEl('modalInput').blur();
}
function submitModalCode() {
  const code = modalEl('modalInput').value.trim();
  if (/^\d{6}$/.test(code)) { closeModal(); joinGame(code); return; }
  const box = modalEl('modalBox'); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  modalSetError('O código tem de ter 6 números.');
}
(function () {
  const input = modalEl('modalInput');
  input.addEventListener('input', () => {
    const clean = input.value.replace(/\D/g, '').slice(0, 6);
    if (clean !== input.value) input.value = clean;
    modalSetError(''); modalRender();
  });
  input.addEventListener('keydown', e => {
    e.stopPropagation();   // não deixa as teclas chegarem aos controlos do jogo
    if (e.key === 'Enter') { e.preventDefault(); submitModalCode(); }
    else if (e.key === 'Escape') closeModal();
  });
  input.addEventListener('focus', modalRender);
  input.addEventListener('blur', modalRender);
  modalEl('modalOverlay').addEventListener('mousedown', e => { if (e.target === modalEl('modalOverlay')) closeModal(); });
})();
const NET = {
  token:'', code:'', retry:0, retryTimer:null, reconnecting:false, peerLost:false,
  lastMsg:0, ping:0, snapEvery:2,
  buf:[], renderFrame:0, hasFrame:false, jitter:0, lastArrival:0, lastRel:-1, pAcc:0,
  lastSent:'', lastSentAt:0
};
function resetNetState() {
  clearTimeout(NET.retryTimer);
  Object.assign(NET, { token:'', code:'', retry:0, retryTimer:null, reconnecting:false, peerLost:false, ping:0, ranked:false, queueing:false, queueSince:0 });
  resetSnapshots();
}
function resetSnapshots() {
  Object.assign(NET, { buf:[], renderFrame:0, hasFrame:false, jitter:0, lastArrival:0, lastRel:-1, pAcc:0, lastSent:'', lastSentAt:0 });
}
function connectCentral(role, code) {
  netCancel(false);
  isMultiplayer = true;
  isHost = role === 'create';
  mySeat = isHost ? 0 : 1;
  S.mode = isHost ? 'mp_host' : 'mp_client';
  S.screen = 'waiting';
  myRoomCode = code || '';
  netConnected = false; netError = '';
  netStatus = 'A ligar ao servidor central...';
  openSocket(() => role === 'create' ? { type:'create' } : { type:'join', code });
}
function openSocket(firstMsg) {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(protocol + '//' + location.host);
  socket = ws;
  ws.addEventListener('open', () => {
    if (socket !== ws) return;
    NET.lastMsg = performance.now();
    netStatus = NET.reconnecting ? 'A restabelecer a sala...' : 'Ligado ao servidor. A preparar sala...';
    if (authToken) sendNet({ type:'auth', token:authToken });   // identifica a conta antes de criar/entrar/ranked
    sendNet(firstMsg());
  });
  ws.addEventListener('message', event => {
    if (socket !== ws) return;
    NET.lastMsg = performance.now();
    let data;
    try { data = JSON.parse(event.data); } catch (_) { return; }
    handleNet(data);
  });
  ws.addEventListener('close', () => { if (socket === ws) onSocketLost(); });
  ws.addEventListener('error', () => {});
}
function fatalNet(message) {
  clearTimeout(NET.retryTimer);
  NET.reconnecting = false; NET.peerLost = false;
  netConnected = false; netError = message;
  const old = socket; socket = null;
  if (old) { try { old.close(); } catch (_) {} }
  S.screen = 'waiting';   // mostra o erro e o botão Voltar
}
function onSocketLost() {
  if (!isMultiplayer) return;
  socket = null; netConnected = false;
  if (S.screen === 'gameover') return;
  if (NET.queueing && !NET.token && NET.retry < 10) {          // queda enquanto espera na fila ranked: volta a entrar
    NET.reconnecting = true; netStatus = 'Ligação perdida. A reconectar...';
    const wait = Math.min(3000, 400 * ++NET.retry);
    clearTimeout(NET.retryTimer);
    NET.retryTimer = setTimeout(() => { if (isMultiplayer && NET.queueing) openSocket(() => ({ type:'rankedJoin' })); }, wait);
  } else if (NET.token && NET.code && NET.retry < 10) {
    NET.reconnecting = true; netStatus = 'Ligação perdida. A reconectar...';
    const wait = Math.min(3000, 400 * ++NET.retry);
    clearTimeout(NET.retryTimer);
    NET.retryTimer = setTimeout(() => {
      if (!isMultiplayer) return;
      openSocket(() => ({ type:'resume', code:NET.code, seat:mySeat, token:NET.token }));
    }, wait);
  } else {
    fatalNet(NET.token ? 'Ligação ao servidor perdida. Volta a entrar na sala.' : 'Não foi possível ligar ao servidor. Verifica a ligação e tenta novamente.');
  }
}
function handleNet(data) {
  switch (data.type) {
    case 'roomCreated':
      myRoomCode = data.code; mySeat = 0; isHost = true; NET.token = data.token; NET.code = data.code;
      netConnected = false; netStatus = 'Sala criada. À espera do Jogador 2...'; break;

    if (pr.kind === 'fire' && Math.random() < 0.7) spawnParticles(pr.x, pr.y, 1, '#ff8a1a', 1.5);

function drawVolt(d) {

  if (st === 'idle') { sy = 1 + Math.sin(t * 0.08) * 0.025; sx = 1 / sy; }

  else if (st === 'fall') { sy = 0.94; sx = 1.06; rot = 0.08; aL = -0.25; aR = 0.25; dxL = -4 * s; dxR = 4 * s; }
  else if (st === 'hit') { rot = -0.35; ox = -4; aL = 0.2; aR = -0.1; lfL = 1.5 * s; }
  else if (st === 'dodge') { sx = 1.15; sy = 0.88; rot = 0.25; aL = -0.4; aR = 0.2; dxL = -4 * s; dxR = 5 * s; }

function drawPixelPlatform(x, y, w, h, isBridge = false) {
  if (isBridge) {
    // Ponte de Madeira (baseada na imagem)
    ctx.fillStyle = '#b05a32'; // Madeira
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#8a3f20'; // Sombras
    for (let i = 0; i < w; i += 15) {
      ctx.fillRect(x + i, y, 2, h);
    }
    ctx.fillStyle = '#d97a4a'; // Destaque
    ctx.fillRect(x, y, w, 2);
    // Cordas
    ctx.fillStyle = '#5c3a21';
    ctx.fillRect(x, y - 10, 4, 10);
    ctx.fillRect(x + w - 4, y - 10, 4, 10);
    return;
  }

  // Base da terra
  ctx.fillStyle = '#4a1d3e'; // Roxo escuro
  ctx.fillRect(x, y, w, h);

  // Textura da terra (pedras laranjas/marrons)
  ctx.fillStyle = '#8c3a31';
  for (let i = 0; i < w; i += 12) {
    for (let j = 10; j < h; j += 12) {
      if ((i + j) % 24 === 0) ctx.fillRect(x + i, y + j, 6, 6);
      if ((i * j) % 36 === 0) ctx.fillRect(x + i + 4, y + j - 4, 4, 4);
    }
  }
  
  // Borda laranja brilhante
  ctx.fillStyle = '#d95d39';
  ctx.fillRect(x, y + h - 4, w, 4);
  ctx.fillRect(x, y, w, 2);

  // Grama (superior)
  ctx.fillStyle = '#00e676'; // Verde claro
  ctx.fillRect(x, y, w, 10);
  ctx.fillStyle = '#00b248'; // Verde escuro
  ctx.fillRect(x, y + 10, w, 4);
  
  // Detalhes de pixel da grama (pingos)
  ctx.fillStyle = '#69f0ae';
  for (let i = 0; i < w; i += 8) {
    if (hash(x + i * 3 + y) > 0.4) ctx.fillRect(x + i, y, 4, 3);
    if (hash(x + i * 7 + y + 1) > 0.6) ctx.fillRect(x + i + 2, y + 4, 3, 3);
  }
}

    p.lavaCd = Math.max(0, (p.lavaCd || 0) - dt); p.hzCd = Math.max(0, (p.hzCd || 0) - dt);
    if (m.lavaY && p.y > m.lavaY && p.lavaCd <= 0) lavaBounce(p);
    for (const h of m.hazards) {
      if (getHazardPhase(h) !== 'active') continue;
      if (h.type === 'lavaJet') {
        if (p.hzCd <= 0 && p.invuln <= 0 && overlap({ x: p.x - p.w / 2, y: p.y - p.h, w: p.w, h: p.h }, jetBox(h, m))) {
          damagePlayer(p, 10, 10 + p.damage * 0.1, Math.sign(p.x - h.x) || 1, 1); p.hzCd = 45; S.shake = 10; spawnParticles(p.x, p.y - p.h / 2, 14, '#ff7a1a', 5);
        }
      } else if (h.type === 'wind' && p.y - p.h / 2 > h.y && p.y - p.h / 2 < h.y + h.h) p.vx += windDir(h) * 0.16 * dt;
    }
  }
}

function drawProjectiles() {
  const f = S.frame;
  for (const pr of S.projectiles) {
    ctx.save(); ctx.translate(pr.x, pr.y); const d = Math.sign(pr.vx) || 1;
    if (pr.kind === 'fire') {
      ctx.shadowColor = '#ff6a00'; ctx.shadowBlur = 24; ctx.rotate(Math.atan2(pr.vy, pr.vx) + Math.PI);
      ctx.fillStyle = '#ff4a00'; ctx.beginPath(); ctx.moveTo(0, -12); ctx.quadraticCurveTo(30, -8 + Math.sin(f * 0.6) * 6, 54 + Math.sin(f) * 6, 0); ctx.quadraticCurveTo(30, 8, 0, 12); ctx.fill();
      ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(0, 0, 15, 0, 6.283); ctx.fill(); ctx.fillStyle = '#ffe9a0'; ctx.beginPath(); ctx.arc(-2, -1, 8, 0, 6.283); ctx.fill();
      ctx.shadowBlur = 0; ctx.strokeStyle = '#140a08'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 15, 0, 6.283); ctx.stroke();
    } else if (pr.kind === 'ice') {
      ctx.rotate(Math.atan2(pr.vy, pr.vx)); ctx.shadowColor = '#4fd8ff'; ctx.shadowBlur = 16;
      ctx.fillStyle = 'rgba(159,232,255,0.35)'; ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-34, -5); ctx.lineTo(-34, 5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#bff3ff'; ctx.strokeStyle = '#2aa8e0'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(0, -9); ctx.lineTo(-10, 0); ctx.lineTo(0, 9); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(1, -4); ctx.lineTo(-3, 0); ctx.lineTo(1, 4); ctx.closePath(); ctx.fill();
    } else if (pr.kind === 'wave') {
      ctx.scale(d, 1); ctx.shadowColor = '#ff6a00'; ctx.shadowBlur = 16;
      for (let i = 0; i < 4; i++) { const hh = 28 + Math.sin(f * 0.5 + i * 1.7) * 8 - i * 4, x = -i * 16; ctx.fillStyle = i % 2 ? '#ffb020' : '#ff4a00'; ctx.beginPath(); ctx.moveTo(x - 14, 14); ctx.quadraticCurveTo(x - 6, 14 - hh * 0.6, x, 14 - hh); ctx.quadraticCurveTo(x + 4, 14 - hh * 0.5, x + 14, 14); ctx.fill(); }
    } else {
      ctx.scale(d, 1); ctx.shadowColor = '#4fd8ff'; ctx.shadowBlur = 20; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      [[9, 'rgba(79,216,255,0.8)'], [4, '#ffe14d'], [1.5, '#ffffff']].forEach(([lw, col]) => { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(14, 0); for (let i = 1; i <= 7; i++) ctx.lineTo(14 - i * 10, Math.sin(f * 1.3 + i * 2.1) * 10 * (i / 7 + 0.3)); ctx.stroke(); });
      ctx.fillStyle = '#4fd8ff'; ctx.beginPath(); ctx.arc(14, 0, 8, 0, 6.283); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(14, 0, 4, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }
}

function drawParticles() {
  for (const pt of S.particles) {
    const a = pt.life / pt.max; ctx.save(); ctx.globalAlpha = a;
    if (pt.dmgNum) { ctx.font = 'bold ' + pt.size + 'px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = pt.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.strokeText(pt.text, pt.x, pt.y); ctx.fillText(pt.text, pt.x, pt.y); }
    else { ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * a, 0, Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
}

function drawHUD() {
  for (const p of S.players) {
    if (p.eliminated) continue;
    const isP1 = p.idx === 0, x = isP1 ? 40 : W - 40, align = isP1 ? 'left' : 'right', y = 40;
    ctx.save(); const dmgPct = Math.floor(p.damage || 0); const color = dmgPct < 50 ? '#ffffff' : dmgPct < 100 ? '#ffcc00' : dmgPct < 150 ? '#ff6600' : '#ff2222';
    ctx.font = 'bold 48px system-ui'; ctx.textAlign = align; ctx.fillStyle = color; ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.strokeText(dmgPct + '%', x, y + 20); ctx.fillText(dmgPct + '%', x, y + 20);
    ctx.font = 'bold 18px system-ui'; ctx.fillStyle = p.char.color; ctx.fillText(p.char.name, x, y + 45);
    ctx.font = 'bold 24px system-ui'; ctx.fillStyle = p.char.accent; let stockStr = ''; for (let i = 0; i < (p.stocks || 0); i++) stockStr += '● '; ctx.fillText(stockStr, x, y + 72);
    if (p.dodgeCd > 0) { const w = 60, ratio = p.dodgeCd / 60, bx = isP1 ? x : x - w; ctx.fillStyle = '#333'; ctx.fillRect(bx, y + 82, w, 6); ctx.fillStyle = '#0ff'; ctx.fillRect(bx, y + 82, w * (1 - ratio), 6); }
    ctx.restore();
  }
}

function lerpColor(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const m = (s) => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t);
  return 'rgb(' + m(16) + ',' + m(8) + ',' + m(0) + ')';
}

}

const BTN_STYLES = {
  '#5ab5e8': { top: '#c9f0ff', bot: '#5fbdf0', edge: 'wave' },
  '#9a7b5e': { top: '#d9c79a', bot: '#8d7656', edge: 'rock' },
  '#f9a03f': { top: '#ffe070', bot: '#f2791c', edge: 'fire' },
  '#ff4444': { top: '#ffb0a8', bot: '#e0342f', edge: 'rock' }
};

function btnPath(x, y, w, h, edge, seed) {
  const n = 7, xe = x + w - 24, pts = [];
  for (let i = 0; i <= n; i++) {
    const r = Math.abs(Math.sin(seed * 12.9898 + i * 78.233));
    const out = (i % 2 === 0) ? (edge === 'fire' ? 10 + r * 22 : 8 + r * 14) : r * 6;
    pts.push([xe + out, y + h * i / n]);
  }
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(xe, y); ctx.lineTo(pts[0][0], pts[0][1]);
  if (edge === 'wave') { for (let i = 1; i <= n; i++) ctx.quadraticCurveTo(pts[i - 1][0] + 10, (pts[i - 1][1] + pts[i][1]) / 2, pts[i][0], pts[i][1]); }
  else { for (let i = 1; i <= n; i++) ctx.lineTo(pts[i][0], pts[i][1]); }
  ctx.lineTo(x, y + h); ctx.closePath();
}

function drawMenuButton(text, x, y, w, h, color, hoverColor, isHovered, action) {
  const st = BTN_STYLES[color] || BTN_STYLES['#5ab5e8'];
  const key = x + '|' + y + '|' + text, prev = btnAnim[key] || 0;
  const a = btnAnim[key] = prev + ((isHovered ? 1 : 0) - prev) * 0.25;
  if (isHovered) uiHover = true;
  let seed = 0; for (const ch of text) seed += ch.charCodeAt(0);
  const bx = x + a * 16;
  ctx.save();
  btnPath(bx + 3, y + 6, w, h, st.edge, seed); ctx.fillStyle = 'rgba(10,30,70,0.30)'; ctx.fill();
  btnPath(bx, y, w, h, st.edge, seed);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, lerpColor(st.top, '#ffffff', a * 0.4)); g.addColorStop(1, lerpColor(st.bot, '#ffffff', a * 0.35));
  ctx.fillStyle = g; ctx.shadowColor = 'rgba(255,255,255,0.9)'; ctx.shadowBlur = 18 * a; ctx.fill(); ctx.shadowBlur = 0;
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,40,90,0.55)'; ctx.stroke();
  ctx.save(); ctx.clip(); ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fillRect(bx, y, w + 30, h * 0.42); ctx.restore();
  ctx.font = '28px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.strokeText(text, bx + 26, y + h / 2 + 2);
  ctx.fillStyle = lerpColor('#102a43', '#0b57c7', a); ctx.fillText(text, bx + 26, y + h / 2 + 2);
  ctx.restore();
  if (isHovered && mouse.click) action();
}

function drawMenuVolt(t) {
  const cx = 640, bob = Math.sin(t * 2) * 7, hgt = 500;
  const wid = hgt * ((voltImg.naturalWidth / voltImg.naturalHeight) || 0.91);
  const gl = ctx.createRadialGradient(cx, 360 + bob, 30, cx, 360 + bob, 300);
  gl.addColorStop(0, 'rgba(255,221,0,0.45)'); gl.addColorStop(0.5, 'rgba(0,221,255,0.18)'); gl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gl; ctx.fillRect(cx - 320, 40, 640, 640);
  ctx.fillStyle = 'rgba(20,40,90,0.28)'; ctx.beginPath(); ctx.ellipse(cx, 622, 150 - bob * 2, 20 - bob * 0.4, 0, 0, 6.283); ctx.fill();
  if (voltImg.complete && voltImg.naturalWidth) {
    ctx.save(); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(voltImg, cx - wid / 2, 110 + bob, wid, hgt); ctx.restore();
  }
  ctx.save(); ctx.strokeStyle = '#ffe14d'; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.shadowColor = '#fff7a0'; ctx.shadowBlur = 12;
  const k = Math.floor(t * 7);
  [[470, 250, -1], [810, 240, 1], [490, 470, -1], [800, 490, 1]].forEach(([ax, ay, dir], b) => {

  ctx.save(); ctx.fillStyle = 'rgba(14,26,64,0.92)'; ctx.fillRect(x, y, w, h); ctx.strokeStyle = '#5aa7e8'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);

function drawPortrait(id, cx, cy, r) {
  const c = id && CHARACTERS[id];

    const totalVotes = Object.values(S.votes).reduce((a, b) => a + b, 0);
    ctx.fillText('Votos recebidos: ' + totalVotes + '/2', W/2, 620);
    if (totalVotes >= 2) { ctx.fillStyle = '#ffaa00'; ctx.font = 'bold 22px system-ui'; ctx.fillText('Iniciando partida...', W/2, 660); }
  } else {
    ctx.fillText(S.myVote ? 'Voto registrado. Aguardando o outro jogador...' : 'Clique em um mapa para votar.', W/2, 620);
  }
  ctx.restore();
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, W, H); ctx.save(); ctx.textAlign = 'center'; ctx.font = 'bold 72px system-ui';
  const w = S.winner, R = S.ranked, who = (R && S.names && S.names[w.idx]) || w.char.name;
  ctx.fillStyle = w.char.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 6; ctx.strokeText(who + ' VENCEU!', W/2, H/2 - 60); ctx.fillText(who + ' VENCEU!', W/2, H/2 - 60);
  let y = H/2 + 30;
  if (R) {
    ctx.font = 'bold 46px system-ui'; ctx.lineWidth = 5; ctx.fillStyle = R.won ? '#7cfc7c' : '#ff6a5a';
    const head = R.won ? 'VITÓRIA' : 'DERROTA';
    ctx.strokeText(head, W/2, H/2 + 10); ctx.fillText(head, W/2, H/2 + 10);
    const delta = R.first ? 'Elo inicial' : (R.delta >= 0 ? '+' : '') + R.delta;
    ctx.font = 'bold 32px system-ui'; ctx.fillStyle = '#fff'; ctx.fillText('ELO ' + R.elo + '  (' + delta + ')', W/2, H/2 + 60);
    if (R.forfeit) { ctx.font = '18px system-ui'; ctx.fillStyle = '#ffd37a'; ctx.fillText('O adversário abandonou a partida.', W/2, H/2 + 92); }
    y = H/2 + 140;
  }
  ctx.font = '20px system-ui'; ctx.fillStyle = '#aaa'; ctx.fillText('Clique para voltar ao menu', W/2, y); ctx.restore();
}

// ============================================================
// LOOP E ATUALIZAÇÃO
// ============================================================
let lastTime = performance.now();

function frame(now) {
  const dt = Math.min(3, (now - lastTime) / 16.67); lastTime = now;

  if (S.screen === 'playing') {
    if (isMultiplayer) {
      // Os dois jogadores enviam apenas comandos; a simulação corre no servidor.
      sendInputIfChanged(now);
      sampleSnapshots(false, dt);   // interpolação entre snapshots (independente do FPS)
      stepClientParticles(dt);
    } else {
      update(dt); S.frame += dt;
    }
  }
  render(); drawNetOverlay(); canvas.style.cursor = uiHover ? 'pointer' : 'default'; uiHover = false; mouse.click = false;
}
function loop(now) {
  try { frame(now); }
  catch (e) { console.error(e); try { ctx.setTransform(1, 0, 0, 1, 0, 0); } catch (_) {} uiHover = false; mouse.click = false; }
  requestAnimationFrame(loop);
}

function update(dt) {
  if (S.hitlag > 0) { S.hitlag -= dt; return; }
  S.shake *= 0.9;

  for (const p of S.players) {
    if (p.eliminated) continue;
    let inputs;
    if (p.isAI) { inputs = updateAI(p, S.players.find(o => o !== p && !o.eliminated)); }
    else { inputs = readInput(p.idx); }

    if (inputs.light) tryAttack(p, 'light');
    if (inputs.heavy) tryAttack(p, 'heavy');
    if (inputs.special) tryAttack(p, 'special');

    updatePlayer(p, dt, inputs); updateAttack(p, dt);
  }

  hazardEffects(dt); updateProjectiles(dt); updateParticles(dt);

  const alive = S.players.filter(p => !p.eliminated);
  if (alive.length === 1) {
    S.winner = alive[0]; S.screen = 'gameover'; S.shake = 0; S.hitlag = 0;
  }
}

function readInput(idx) {
  const isP1 = idx === 0;
  const jumpKey = isP1 ? keys['w'] : keys['arrowup'];
  if (isP1) return { left: keys['a'], right: keys['d'], jump: jumpKey, down: keys['s'], light: keys['j'], heavy: keys['k'], special: keys['l'], dodge: keys['shift'] };
  return { left: keys['arrowleft'], right: keys['arrowright'], jump: jumpKey, down: keys['arrowdown'], light: keys['1'], heavy: keys['2'], special: keys['3'], dodge: keys['0'] };
}

function startGame(mapId, fromNetwork = false) {
  S.map = MAPS[mapId]; S.players = []; S.projectiles = []; S.particles = [];
  S.winner = null; S.frame = 0; S.hitlag = 0; S.shake = 0; S._startingGame = false;
  const p1 = makePlayer(S.p1Char, 0, S.map.spawns[0]);
  const p2 = makePlayer(S.p2Char, 1, S.map.spawns[1]);

  if (S.mode === '1p') p2.isAI = true;
  if (isMultiplayer) { p2.isAI = false; p1.isAI = false; }

  p2.facing = -1; S.players = [p1, p2]; S.screen = 'playing';


}

function handleMenuClick() {
  if (S.screen === 'menu') return;
  if (S.screen === 'charselect' && S.mode !== 'mp_client') {
    const chars = Object.values(CHARACTERS);
    const cardW = 260, cardH = 420, gap = 30;
    const totalW = chars.length * cardW + (chars.length - 1) * gap;
    const startX = (W - totalW) / 2;
    for (let i = 0; i < chars.length; i++) {
      const x = startX + i * (cardW + gap), y = 160;
      if (mouse.x > x && mouse.x < x + cardW && mouse.y > y && mouse.y < y + cardH) {
        if (S.mode === 'mp_host') {
          S.p1Char = chars[i].id;
          S.p2Char = chars[i].id === 'ignis' ? 'volt' : 'ignis';
        } else {
          if (!S.p1Char) S.p1Char = chars[i].id;
          else if (!S.p2Char && chars[i].id !== S.p1Char) S.p2Char = chars[i].id;
          else if (S.p2Char) { if (chars[i].id === S.p1Char) S.p1Char = null; else if (chars[i].id === S.p2Char) S.p2Char = null; }
        }
        break;
      }
    }
  } else if (S.screen === 'mapvote' && !S.myVote) {
    const maps = Object.values(MAPS);
    const cardW = 360, cardH = 400, gap = 20;
    const totalW = maps.length * cardW + (maps.length - 1) * gap;
    const startX = (W - totalW) / 2;
    for (let i = 0; i < maps.length; i++) {
      const x = startX + i * (cardW + gap), y = 160;
      if (mouse.x > x && mouse.x < x + cardW && mouse.y > y && mouse.y < y + cardH) {
        S.myVote = maps[i].id;
        if (isMultiplayer) { sendNet({ type:'vote', mapId:maps[i].id }); }
        else { startGame(maps[i].id); }
        break;
      }
    }
  } else if (S.screen === 'gameover') {
    if (isMultiplayer) { netCancel(); S.winner = null; S.players = []; S.projectiles = []; S.particles = []; return; }
    S.screen = 'menu'; S.winner = null; S.players = []; S.projectiles = []; S.particles = [];
  } else if (S.screen === 'charselect_preview') {
    S.screen = 'menu';
  }
}

// Nome pequeno por cima do personagem (só em partidas online).
function drawNameTag(p) {
  if (p.eliminated || (p.respawn && p.respawn > 0)) return;
  const name = S.names[p.idx] || ('Jogador ' + (p.idx + 1));
  ctx.save();
  ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(name).width + 14, x = p.x, y = Math.min(WH - 12, Math.max(16, p.y - (p.h || 68) - 28));
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; roundRect(x - w / 2, y - 9, w, 18, 9); ctx.fill();
  ctx.fillStyle = p.idx === 0 ? '#9fd8ff' : '#ffb3aa'; ctx.fillText(name, x, y + 1);
  ctx.restore();
}

function drawLeaderboard() {
  drawMenuBackground();
  const inside = (x, y, w, h) => mouse.x > x && mouse.x < x + w && mouse.y > y && mouse.y < y + h;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  ctx.font = '54px ' + FONT; ctx.lineWidth = 9; ctx.strokeStyle = '#0a2a6b'; ctx.strokeText('LEADERBOARD', W / 2, 70);
  ctx.fillStyle = '#fff'; ctx.fillText('LEADERBOARD', W / 2, 70);
  const px = 190, py = 96, pw = 900, ph = 500, rowH = 38, top = py + 56;
  ctx.shadowColor = 'rgba(10,30,70,0.35)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  roundRect(px, py, pw, ph, 20); ctx.fillStyle = 'rgba(245,250,255,0.92)'; ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.save(); roundRect(px, py, pw, ph, 20); ctx.clip();
  ctx.fillStyle = '#2a7be8'; ctx.fillRect(px, py, pw, 46); ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.fillRect(px, py, pw, 18);
  ctx.restore();
  ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; roundRect(px, py, pw, ph, 20); ctx.stroke();
  const cx = { rank: px + 56, name: px + 118, elo: px + 520, wins: px + 668, losses: px + 806 };
  ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.font = '22px ' + FONT;
  ctx.textAlign = 'center'; ctx.fillText('#', cx.rank, py + 24);
  ctx.textAlign = 'left'; ctx.fillText('JOGADOR', cx.name, py + 24);
  ctx.textAlign = 'center'; ctx.fillText('ELO', cx.elo, py + 24); ctx.fillText('VITÓRIAS', cx.wins, py + 24); ctx.fillText('DERROTAS', cx.losses, py + 24);

  const rows = LB.rows;
  if (LB.loading || LB.error || !rows.length) {
    ctx.textAlign = 'center'; ctx.font = '26px ' + FONT; ctx.fillStyle = LB.error ? '#b3261a' : '#47608f';
    ctx.fillText(LB.loading ? 'A carregar...' : LB.error ? LB.error : 'Ainda ninguém jogou Ranked.', W / 2, py + ph / 2 + 10);
  } else {
    const medal = ['#e0a800', '#8f9bb0', '#b4743a'];
    for (let i = 0; i < LB_VISIBLE; i++) {
      const r = rows[LB.scroll + i]; if (!r) break;
      const y = top + i * (rowH + 2), me = ACCOUNT && r.name.toLowerCase() === ACCOUNT.name.toLowerCase();
      ctx.fillStyle = me ? 'rgba(255,214,60,0.45)' : i % 2 ? 'rgba(47,111,216,0.07)' : 'rgba(47,111,216,0.14)';
      roundRect(px + 18, y, pw - 36, rowH, 10); ctx.fill();
      ctx.textAlign = 'center'; ctx.font = '24px ' + FONT; ctx.fillStyle = r.rank <= 3 ? medal[r.rank - 1] : '#47608f'; ctx.fillText(String(r.rank), cx.rank, y + rowH / 2 + 1);
      ctx.textAlign = 'left'; ctx.font = 'bold 20px system-ui'; ctx.fillStyle = '#102a43'; ctx.fillText(lobbyFit(r.name, 330), cx.name, y + rowH / 2 + 1);
      ctx.textAlign = 'center'; ctx.font = '26px ' + FONT; ctx.fillStyle = '#0f3a8f'; ctx.fillText(String(r.elo), cx.elo, y + rowH / 2 + 1);
      ctx.font = 'bold 20px system-ui'; ctx.fillStyle = '#157a4a'; ctx.fillText(String(r.wins), cx.wins, y + rowH / 2 + 1);
      ctx.fillStyle = '#b3261a'; ctx.fillText(String(r.losses), cx.losses, y + rowH / 2 + 1);
    }
    if (rows.length > LB_VISIBLE) {
      ctx.textAlign = 'center'; ctx.font = '14px system-ui'; ctx.fillStyle = '#6b7fa3';
      ctx.fillText('Role o rato para ver mais · ' + (LB.scroll + 1) + '–' + Math.min(rows.length, LB.scroll + LB_VISIBLE) + ' de ' + rows.length, W / 2, py + ph - 14);
    }
  }
  ctx.textBaseline = 'alphabetic';
  drawMenuButton('Back', 40, 632, 240, 60, '#ff4444', '#ff6666', inside(40, 632, 240, 60), () => { S.screen = 'menu'; S.menuSub = 'main'; });
  ctx.restore();
}

function render() {
  ctx.save();
  if (S.screen === 'playing' && S.shake > 0.5) {
    ctx.translate((Math.random()-0.5) * S.shake, (Math.random()-0.5) * S.shake);
  }

  if (S.screen === 'menu') { drawMenu(); ctx.restore(); return; }
  if (S.screen === 'waiting') { drawWaiting(); ctx.restore(); return; }
  if (S.screen === 'leaderboard') { drawLeaderboard(); ctx.restore(); return; }
  if (S.screen === 'charselect') {
    drawCharSelect(); ctx.restore();
    if (keys['enter']) { keys['enter'] = false; goMapVote(); }
    return;
  }
  if (S.screen === 'charselect_preview') { drawLegends(); ctx.restore(); if (mouse.click) handleMenuClick(); return; }
  if (S.screen === 'mapvote') {
    drawMapVote(); ctx.restore();
    if (mouse.click) handleMenuClick();
    return;
  }

  ctx.save(); ctx.scale(Z, Z); drawBackground(S.map, S.frame); drawPlatforms(S.map, S.frame); drawHazards(S.map, S.frame);
  const sorted = [...S.players].sort((a, b) => a.y - b.y); for (const p of sorted) drawCharacter(p);
  if (isMultiplayer && S.names) for (const p of sorted) drawNameTag(p);
  drawProjectiles(); drawParticles(); ctx.restore(); drawHUD();

  if (S.screen === 'gameover') drawGameOver();
  ctx.restore();
  if (S.screen === 'gameover' && mouse.click) handleMenuClick();
}

requestAnimationFrame(loop);
</script>
