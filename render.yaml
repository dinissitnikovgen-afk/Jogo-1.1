services:
  - type: web
    name: brawl-central
    runtime: node
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SNAP_HZ        # 20, 30 ou 60 snapshots por segundo
        value: "30"
